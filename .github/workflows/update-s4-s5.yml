name: Update RTG Guide S4 S5

on:
  push:
    paths:
      - '.github/workflows/update-s4-s5.yml'

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply S4 and S5 hero update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, re
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          blobs = {
              'assets/heroes/s5-sheva.jpg': 'c4f6bd895ecec74d9b9fb28cea6311d4ad329de6',
              'assets/heroes/s5-chris.jpg': '70a719993d35dcc691b4b98e5c0cee925e3682a0',
              'assets/heroes/s5-excella.jpg': '589108a271709e60cdef396dde693c6dac0950a4',
              'assets/heroes/s4-sherry.jpg': '84439c2203533e40784380360bfff20b1e5450e6',
              'assets/heroes/s4-jake.jpg': 'c1cae7c54609b4620eba0e4a2719f3507facee8d',
              'assets/heroes/s4-piers.jpg': 'e53721388d5123b92b705bf1114b5ee7aec6d736',
          }

          for rel, sha in blobs.items():
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'rtg-guide-update',
                  },
              )
              with urlopen(req) as response:
                  data = json.load(response)
              out = Path(rel)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(base64.b64decode(data['content']))

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global html
              if old not in html:
                  raise RuntimeError(f'Could not find expected marker: {label}')
              html = html.replace(old, new, 1)

          replace_once(
              '.s3{background:rgba(255,69,0,.2);color:#ff6b35;border:1px solid rgba(255,69,0,.3);}\n.badge{',
              '.s3{background:rgba(255,69,0,.2);color:#ff6b35;border:1px solid rgba(255,69,0,.3);}\n.s4{background:rgba(155,89,182,.2);color:#c39bd3;border:1px solid rgba(155,89,182,.35);}\n.s5{background:rgba(236,64,122,.2);color:#ff80ab;border:1px solid rgba(236,64,122,.35);}\n.badge{',
              'season badge CSS',
          )
          replace_once(
              '.badge.ss{background:rgba(255,69,0,.25);color:#ff4500;}\n.badge.s{',
              '.badge.sss{background:rgba(236,64,122,.28);color:#ff80ab;}\n.badge.ss{background:rgba(255,69,0,.25);color:#ff4500;}\n.badge.s{',
              'SSS badge CSS',
          )
          replace_once(
              '.tier-label.ss{background:rgba(255,69,0,.18);color:#ff4500;border-right:3px solid #ff4500;}\n.tier-label.s{',
              '.tier-label.sss{background:rgba(236,64,122,.18);color:#ff80ab;border-right:3px solid #ff4081;}\n.tier-label.ss{background:rgba(255,69,0,.18);color:#ff4500;border-right:3px solid #ff4500;}\n.tier-label.s{',
              'SSS tier CSS',
          )

          replace_once('FULL STRATEGY COMMAND CENTER — S1 · S2 · S3', 'FULL STRATEGY COMMAND CENTER — S1 · S2 · S3 · S4 · S5', 'header seasons')
          replace_once('// UPDATED MARCH 2026 //', '// UPDATED AUGUST 2026 //', 'update date')
          replace_once('// ALL SEASONS · S1 · S2 · S3 //', '// ALL SEASONS · S1 · S2 · S3 · S4 · S5 //', 'tier subtitle')
          replace_once(
              '<div class="callout gold"><strong>Stat ceilings:</strong> S3 = 290% · S1 Leon = 260% · Other S1 = 200% · All S2 = 240%. Skills &amp; weapon synergy matter as much as raw stats.</div>',
              '<div class="callout gold"><strong>Stat ceilings:</strong> S5 = 444% · S4 = 370% · S3 = 290% · S1 Leon = 260% · All S2 = 240% · Other S1 = 200%. Skills &amp; weapon synergy matter as much as raw stats.</div>',
              'tier stat ceiling',
          )

          sss = '''    <!-- SSS -->
    <div class="tier-row">
      <div class="tier-label sss">SSS</div>
      <div class="tier-cards">
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s5-excella.jpg" alt="Excella Gionne">
          <div class="char-card-body">
            <div class="char-name">EXCELLA GIONNE <span class="season-badge s5">S5</span></div>
            <div class="char-role">SEASON 5 · NEW HERO</div>
            <div class="char-stat">444% MAX STATS</div>
            <div class="char-tagline">Season 5 powerhouse — SSS tier.</div>
          </div>
        </div>
      </div>
    </div>

'''
          replace_once('    <!-- SS -->', sss + '    <!-- SS -->', 'SSS tier insertion')

          s_cards = '''
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s5-sheva.jpg" alt="Sheva Alomar">
          <div class="char-card-body">
            <div class="char-name">SHEVA ALOMAR <span class="season-badge s5">S5</span></div>
            <div class="char-role">SEASON 5 · NEW HERO</div>
            <div class="char-stat">444% MAX STATS</div>
            <div class="char-tagline">S-tier Season 5 hero.</div>
          </div>
        </div>
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s5-chris.jpg" alt="BSAA Chris Redfield">
          <div class="char-card-body">
            <div class="char-name">BSAA CHRIS <span class="season-badge s5">S5</span></div>
            <div class="char-role">SEASON 5 · NEW HERO</div>
            <div class="char-stat">444% MAX STATS</div>
            <div class="char-tagline">S-tier Season 5 hero.</div>
          </div>
        </div>
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s4-jake.jpg" alt="Jake Muller">
          <div class="char-card-body">
            <div class="char-name">JAKE MULLER <span class="season-badge s4">S4</span></div>
            <div class="char-role">SEASON 4 · NEW HERO</div>
            <div class="char-stat">370% MAX STATS</div>
            <div class="char-tagline">S-tier Season 4 hero.</div>
          </div>
        </div>'''
          replace_once(
              '    <!-- S -->\n    <div class="tier-row">\n      <div class="tier-label s">S</div>\n      <div class="tier-cards">',
              '    <!-- S -->\n    <div class="tier-row">\n      <div class="tier-label s">S</div>\n      <div class="tier-cards">' + s_cards,
              'S tier heroes',
          )

          a_cards = '''
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s4-sherry.jpg" alt="Sherry Birkin">
          <div class="char-card-body">
            <div class="char-name">SHERRY BIRKIN <span class="season-badge s4">S4</span></div>
            <div class="char-role">SEASON 4 · NEW HERO</div>
            <div class="char-stat">370% MAX STATS</div>
            <div class="char-tagline">A-tier Season 4 hero.</div>
          </div>
        </div>
        <div class="char-card">
          <img class="char-card-img" src="assets/heroes/s4-piers.jpg" alt="Piers Nivans">
          <div class="char-card-body">
            <div class="char-name">PIERS NIVANS <span class="season-badge s4">S4</span></div>
            <div class="char-role">SEASON 4 · NEW HERO</div>
            <div class="char-stat">370% MAX STATS</div>
            <div class="char-tagline">A-tier Season 4 hero.</div>
          </div>
        </div>'''
          replace_once(
              '    <!-- A -->\n    <div class="tier-row">\n      <div class="tier-label a">A</div>\n      <div class="tier-cards">',
              '    <!-- A -->\n    <div class="tier-row">\n      <div class="tier-label a">A</div>\n      <div class="tier-cards">' + a_cards,
              'A tier heroes',
          )

          replace_once('// S1 vs S2 vs S3 HEAD-TO-HEAD //', '// S1 vs S2 vs S3 vs S4 vs S5 HEAD-TO-HEAD //', 'comparison subtitle')

          def set_overview_width(hero_name, width):
              global html
              pattern = re.compile(r'(<span class="stat-ov-name">' + re.escape(hero_name) + r'</span>.*?<div class="stat-bar-fill" style="width:)\d+(%)', re.S)
              html2, count = pattern.subn(lambda m: m.group(1) + str(width) + m.group(2), html, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not update stat bar: {hero_name}')
              html = html2

          set_overview_width('LEON', 59)
          set_overview_width('S1 OTHER', 45)
          set_overview_width('ALL S2', 54)
          set_overview_width('ALL S3', 65)

          anchor = '<span class="stat-ov-name">ALL S3</span>'
          anchor_pos = html.index(anchor)
          row_end = html.index('\n      </div>', anchor_pos) + len('\n      </div>')
          new_stat_rows = '''
      <div class="stat-overview-row">
        <img class="stat-ov-img" src="assets/heroes/s4-piers.jpg" alt="Piers Nivans">
        <span class="stat-ov-name">ALL S4</span><span class="season-badge s4">S4</span>
        <div style="flex:1;margin:0 10px"><div class="stat-bar"><div class="stat-bar-fill" style="width:83%"></div></div></div>
        <span style="font-family:'Share Tech Mono',monospace;color:var(--pale-gold);font-size:12px;flex-shrink:0">370%</span>
      </div>
      <div class="stat-overview-row">
        <img class="stat-ov-img" src="assets/heroes/s5-excella.jpg" alt="Excella Gionne">
        <span class="stat-ov-name">ALL S5</span><span class="season-badge s5">S5</span>
        <div style="flex:1;margin:0 10px"><div class="stat-bar"><div class="stat-bar-fill" style="width:100%"></div></div></div>
        <span style="font-family:'Share Tech Mono',monospace;color:var(--pale-gold);font-size:12px;flex-shrink:0">444%</span>
      </div>'''
          html = html[:row_end] + new_stat_rows + html[row_end:]

          replace_once('COMMUNITY FULL GUIDE · S1 / S2 / S3 ☣', 'COMMUNITY FULL GUIDE · S1 / S2 / S3 / S4 / S5 ☣', 'footer seasons')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit guide update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/heroes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update S4/S5 heroes and tier list"
          git push
